<text x="442" y="148" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#E6E6F0"><tspan fill="#FF2E88" font-weight="700">&gt; </tspan>Classificação automática com IA</text><text x="442" y="170" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#E6E6F0"><tspan fill="#FF2E88" font-weight="700">&gt; </tspan>Taxa de acerto medida, não estimada</text><text x="442" y="192" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#E6E6F0"><tspan fill="#FF2E88" font-weight="700">&gt; </tspan>Autenticação com JWT e bcrypt</text>
<text x="442" y="224" font-family="'Courier New',Courier,monospace" font-size="11" letter-spacing="1" fill="#8A8AA0">PROGRESSO</text>
<text x="806" y="224" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="700" fill="#FF2E88">30%</text>
