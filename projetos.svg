<text x="18" y="76" font-family="'Courier New',Courier,monospace" font-size="20" font-weight="700" fill="#E6E6F0">stock-ledger-api</text>
<text x="18" y="98" font-family="'Courier New',Courier,monospace" font-size="12" fill="#8A8AA0">Controle de estoque que não perde saldo</text><text x="18" y="115" font-family="'Courier New',Courier,monospace" font-size="12" fill="#8A8AA0">com muitos débitos ao mesmo tempo.</text>
<text x="18" y="148" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#E6E6F0"><tspan fill="#3DFF8A" font-weight="700">&gt; </tspan>Transação + SELECT ... FOR UPDATE</text><text x="18" y="170" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#E6E6F0"><tspan fill="#3DFF8A" font-weight="700">&gt; </tspan>Histórico append-only com trigger</text><text x="18" y="192" font-family="'Courier New',Courier,monospace" font-size="12.5" fill="#E6E6F0"><tspan fill="#3DFF8A" font-weight="700">&gt; </tspan>50 débitos simultâneos nos testes e CI</text>
<text x="18" y="224" font-family="'Courier New',Courier,monospace" font-size="11" letter-spacing="1" fill="#8A8AA0">PROGRESSO</text>
<text x="382" y="224" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="700" fill="#3DFF8A">100%</text>
